<head>

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f4f7f5; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; }
  .notice {
    font-family: "Meiryo", "メイリオ", sans-serif; color: #5f6f66;
    font-size: 14px; line-height: 1.7; text-align: center; padding: 40px 20px;
  }
</style>
</head>
<body>
<script>
  // Apps Script のウェブアプリURL(https://script.google.com/macros/s/.../exec)。
  // デプロイし直してURLが変わったら、ここだけ書き換える。
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzG4_o7aHdK49i28KFQMftnoc5ASrZC-Lo_gdgULjFH5jGUYzUIHEZjbHdLLmo2ByxqBQ/exec';

  if (GAS_URL) {
    const frame = document.createElement('iframe');
    frame.src = GAS_URL;
    frame.title = '山創 道具管理';
    document.body.appendChild(frame);
  } else {
    document.body.innerHTML = '<div class="notice">アプリのURLが未設定です。<br>index.html の GAS_URL を設定してください。</div>';
  }
</script>
</body>
</html>
