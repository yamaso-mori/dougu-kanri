<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>アレドコ</title>
<!-- iPhone の「ホーム画面に追加」で使われるアイコンと名前 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="アレドコ" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#2e7d32" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f4f7f5; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; }
  .notice {
    font-family: "Meiryo", "メイリオ", sans-serif; color: #5f6f66;
    font-size: 14px; line-height: 1.7; text-align: center; padding: 40px 20px;
  }
</style>
</head>
<body>
<script>
  // Apps Script のウェブアプリURL(https://script.google.com/macros/s/.../exec)。
  // デプロイし直してURLが変わったら、ここだけ書き換える。
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbz4qabjHT-5Lx0sX9HWgTUOxhvUzCuIju4O3pC37jePI4Xt9iCUiZhyR8yhtTNhYqjRqw/exec';
  const LS_PASSCODE = 'aredoko_passcode';

  let frame = null;

  function showNotice(html) {
    document.body.innerHTML = '<div class="notice">' + html + '</div>';
  }

  // target が win の中(入れ子の iframe を含む)にあるウィンドウかどうか
  function isInside(win, target, depth) {
    if (win === target) return true;
    if (depth > 4) return false;
    try {
      for (let i = 0; i < win.length; i++) {
        if (isInside(win[i], target, depth + 1)) return true;
      }
    } catch (e) { /* たどれない場合は中にないものとして扱う */ }
    return false;
  }

  // アプリ(iframe 内)の合言葉をこのページで預かる。iPhone では iframe 内の保存領域が
  // アプリを閉じると消えることがあるため、消えにくいこちら側にも保存しておく。
  // 応答するのは、このページが開いた iframe の中にある Apps Script の画面からの依頼だけ。
  window.addEventListener('message', (e) => {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
    if (!frame || !e.source || !isInside(frame.contentWindow, e.source, 0)) return;
    const data = e.data || {};
    try {
      if (data.type === 'aredoko:getPasscode') {
        e.source.postMessage({ type: 'aredoko:passcode', passcode: localStorage.getItem(LS_PASSCODE) || '' }, e.origin);
      } else if (data.type === 'aredoko:setPasscode') {
        if (data.passcode) localStorage.setItem(LS_PASSCODE, String(data.passcode));
        else localStorage.removeItem(LS_PASSCODE);
      }
    } catch (err) { /* 保存できない環境ではアプリ側で毎回入力してもらう */ }
  });

  if (window.top !== window.self) {
    // 他のサイトに埋め込まれた状態では動かさない(預かっている合言葉を守るため)
    showNotice('このページは埋め込みでは利用できません。');
  } else if (GAS_URL) {
    frame = document.createElement('iframe');
    frame.src = GAS_URL;
    frame.title = 'アレドコ';
    document.body.appendChild(frame);
  } else {
    showNotice('アプリのURLが未設定です。<br>index.html の GAS_URL を設定してください。');
  }
</script>
</body>
</html>
